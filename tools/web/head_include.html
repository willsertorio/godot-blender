<script>
/* Project Firewall, browser build. At the end of every frame the engine's shell (Emscripten, copying its offscreen
   framebuffer to the canvas) asks WebGL whether the scissor test is on. The browser answers such a question by
   waiting until the GPU process has worked through everything queued, so the page's one thread stood still for
   most of each frame (Chrome, M1: "process step" 33 ms with 2 ms of drawing and 3 ms of scripts). The answer is
   known here: it changes only through enable() and disable(). */
(function () {
	var P = WebGL2RenderingContext.prototype, on = new WeakMap(), SCISSOR_TEST = 0x0C11;
	var enable = P.enable, disable = P.disable, getParameter = P.getParameter, isEnabled = P.isEnabled;
	P.enable = function (cap) { if (cap === SCISSOR_TEST) on.set(this, true); return enable.call(this, cap); };
	P.disable = function (cap) { if (cap === SCISSOR_TEST) on.set(this, false); return disable.call(this, cap); };
	function known(gl) { if (gl.isContextLost()) { on.set(gl, false); return false; } return true; }
	P.getParameter = function (name) { return name === SCISSOR_TEST && known(this) ? on.get(this) === true : getParameter.call(this, name); };
	P.isEnabled = function (cap) { return cap === SCISSOR_TEST && known(this) ? on.get(this) === true : isEnabled.call(this, cap); };
})();
</script>
<script>
/* A sound's numbers that are not numbers. The engine's web audio code hands every volume and pitch to an
   AudioParam, and the browser throws at one that is not finite ("Failed to set the 'value' property on
   'AudioParam'"). Thrown in the middle of the engine's frame, that left the game running with nothing 3D drawn
   any more (the user's "it blacked out after some shots": the HUD over the background colour). Such a value is
   not passed on: a volume becomes 0, a pitch stays what it was. The first one is reported in the console. */
(function () {
	if (typeof AudioParam === "undefined") return;
	var value = Object.getOwnPropertyDescriptor(AudioParam.prototype, "value");
	if (!value || !value.set) return;
	var rates = new WeakSet(), told = false;
	if (typeof AudioBufferSourceNode !== "undefined") {
		var rate = Object.getOwnPropertyDescriptor(AudioBufferSourceNode.prototype, "playbackRate");
		if (rate && rate.get) Object.defineProperty(AudioBufferSourceNode.prototype, "playbackRate", {
			configurable: true, enumerable: rate.enumerable,
			get: function () { var p = rate.get.call(this); rates.add(p); return p; }
		});
	}
	function tell(v, pitch) {
		if (told) return;
		told = true;
		console.warn("Project Firewall: a sound's " + (pitch ? "pitch" : "volume") + " was " + v + "; not passed on to the browser.", new Error().stack);
	}
	Object.defineProperty(AudioParam.prototype, "value", {
		configurable: true, enumerable: value.enumerable,
		get: function () { return value.get.call(this); },
		set: function (v) {
			if (typeof v === "number" && !isFinite(v)) {
				var pitch = rates.has(this);
				tell(v, pitch);
				if (pitch) return;
				v = 0;
			}
			value.set.call(this, v);
		}
	});
	["setValueAtTime", "linearRampToValueAtTime", "exponentialRampToValueAtTime", "setTargetAtTime"].forEach(function (name) {
		var f = AudioParam.prototype[name];
		if (!f) return;
		AudioParam.prototype[name] = function (v) {
			if (typeof v === "number" && !isFinite(v)) { tell(v, rates.has(this)); return this; }
			return f.apply(this, arguments);
		};
	});
})();
</script>
